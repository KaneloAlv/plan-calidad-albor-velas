name: CI

on:
  push:
    branches: [main, fix/accessibility-and-ci]
  pull_request:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Run tests
        run: npm test
        continue-on-error: true
      
      - name: Run accessibility tests
        run: npm run accessibility
        continue-on-error: true
      
      - name: Run Lighthouse CI
        run: lhci autorun
        continue-on-error: true
